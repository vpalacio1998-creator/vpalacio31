<title>OLI</title>
<meta name="author" content="Víctor Palacio"><meta name="copyright" content="VP Visual Project"><meta name="description" content="OLI · Sistema inteligente de gestión y punto de venta. Software propiedad de VP Visual Project · Creado por Víctor Palacio"><meta name="generator" content="OLI">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* OLI — sistema de diseño. Crema cálido + verde menta. Layout: rail ≥900px, barra inferior en celular, ticket a la derecha ≥900px (más angosto hasta 1100px). */
:root{
  --bg:#FAF7F0; --surface:#FFFFFF; --surface-2:#F4F1E8; --ink:#1E2A24; --muted:#66736B; --line:#E7E2D6;
  --marca:#2F7B5A; --marca-d:#235F45; --menta:#8CBA9C; --marca-soft:#E4F1E8; --bar:#BBD9C6; --on-marca:#FFFFFF;
  --warn:#B8700B; --warn-soft:#FBEFD6; --danger:#C0392B; --danger-soft:#FADFDB; --ok:#2F7B5A; --ok-soft:#E4F1E8;
  --shadow:0 1px 2px rgba(30,42,36,.05),0 6px 18px rgba(30,42,36,.04);
  --display:"Fredoka","Trebuchet MS",system-ui,sans-serif;
  --body:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121A16; --surface:#1B2620; --surface-2:#22302A; --ink:#EAF1EC; --muted:#9BAEA3; --line:#2C3C34;
    --marca:#8CBA9C; --marca-d:#A9D0B6; --menta:#8CBA9C; --marca-soft:#223A2E; --bar:#35574A; --on-marca:#10201A;
    --warn:#E0A53A; --warn-soft:#3A2F14; --danger:#FF7B6B; --danger-soft:#43211D; --ok:#7FD0A2; --ok-soft:#1F3A2B;
    --shadow:0 1px 2px rgba(0,0,0,.3);color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#121A16; --surface:#1B2620; --surface-2:#22302A; --ink:#EAF1EC; --muted:#9BAEA3; --line:#2C3C34;
  --marca:#8CBA9C; --marca-d:#A9D0B6; --menta:#8CBA9C; --marca-soft:#223A2E; --bar:#35574A; --on-marca:#10201A;
  --warn:#E0A53A; --warn-soft:#3A2F14; --danger:#FF7B6B; --danger-soft:#43211D; --ok:#7FD0A2; --ok-soft:#1F3A2B;
  --shadow:0 1px 2px rgba(0,0,0,.3);color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
img{max-width:100%}
:focus-visible{outline:3px solid var(--marca);outline-offset:2px;border-radius:8px}
h1,h2,h3,h4{font-family:var(--display);font-weight:600;margin:0;letter-spacing:-.1px;text-wrap:balance}
h2{font-size:26px;margin:2px 0 14px}
h3{font-size:18px;margin:0 0 10px}
.muted{color:var(--muted)}.small{font-size:13px}.xs{font-size:12px}
.num,.big,.kpi b,.r,td.n{font-variant-numeric:tabular-nums}
.ic{display:block;flex:none}
.hide,[hidden]{display:none!important}

/* ---- shell ---- */
.app{min-height:100%}
.rail,.ticket{display:none}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:10px;padding:10px 14px;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.logo{font-family:var(--display);font-weight:700;font-size:30px;line-height:1;color:var(--menta);letter-spacing:.5px}
.top .when{flex:1;min-width:0}
.top .when b{display:block;font-size:14px}
.top .when small{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dot{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none}.dot.off{background:var(--muted)}.dot.bad{background:var(--danger)}
.iconbtn{position:relative;display:grid;place-items:center;width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.iconbtn[data-n]::after{content:attr(data-n);position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;border-radius:9px;background:var(--danger);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 4px}
.rolebtn{display:flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px 7px 9px;font-weight:700;font-size:13px}
.rolebtn.adm{background:var(--marca-soft);border-color:transparent;color:var(--marca-d)}
main{max-width:1180px;margin:0 auto;padding:18px 14px 150px}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.page-h h2{margin:0}.page-h p{margin:2px 0 0;color:var(--muted);font-size:14px}

/* ---- nav ---- */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{position:relative;flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px 8px;min-height:62px;font-size:12px;font-weight:600;color:var(--muted)}
.tabs button[aria-current="page"]{color:var(--marca-d)}
.tabs button[aria-current="page"]::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--marca)}
[data-n]:not(.iconbtn)::after{content:attr(data-n);position:absolute;top:4px;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:var(--marca);color:var(--on-marca);font-size:11px;font-weight:700;display:grid;place-items:center;padding:0 4px}
[data-tone="danger"]:not(.iconbtn)::after{background:var(--danger);color:#fff}
.masgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.masgrid button{position:relative;display:flex;align-items:center;gap:12px;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:15px;font-weight:700;text-align:left}
.masgrid [data-n]::after{top:50%!important;left:auto!important;right:12px;transform:translateY(-50%)}

/* ---- controls ---- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:11px 18px;min-height:46px;font-weight:700;font-size:16px;background:var(--ink);color:var(--bg);transition:transform .08s,background .15s}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--marca);color:var(--on-marca)}.btn.pri:hover{background:var(--marca-d)}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.soft{background:var(--marca-soft);color:var(--marca-d)}
.btn.danger{background:var(--surface);color:var(--danger);border:1px solid var(--line)}
.btn.sm{padding:7px 12px;min-height:38px;font-size:14px;border-radius:10px}
.btn.xl{min-height:56px;font-size:18px;border-radius:14px}
.btn.wide{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btns{display:flex;gap:8px;flex-wrap:wrap}
label.f{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:12px 0 5px}
.in{width:100%;min-height:46px;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 13px;font-size:16px}
.in:focus{border-color:var(--marca);outline:3px solid var(--marca-soft)}
textarea.in{min-height:84px;resize:vertical}
.split{display:grid;grid-template-columns:1fr 1fr;gap:10px}.split3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.check{display:flex;align-items:center;gap:10px;font-weight:600;min-height:40px}
.check input{width:22px;height:22px;accent-color:var(--marca)}
.seg{display:inline-flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:2px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{border:0;background:none;border-radius:9px;padding:8px 13px;font-weight:600;font-size:14px;color:var(--muted);white-space:nowrap;min-height:38px}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 15px;min-height:40px;font-weight:600;font-size:14px}
.chip[aria-pressed="true"]{background:var(--marca);color:var(--on-marca);border-color:var(--marca)}
.search{position:relative}.search .ic{position:absolute;left:13px;top:13px;color:var(--muted)}.search .in{padding-left:42px}

/* ---- surfaces ---- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.card>h3:first-child{margin-top:0}
.card.flat{box-shadow:none}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}.row .l{min-width:0}.row .r{text-align:right;white-space:nowrap;font-weight:700}
.big{font-family:var(--display);font-weight:600;font-size:34px;line-height:1.1}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px}
.kpi{min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow);min-width:0}
.kpi span{display:block;font-size:13px;font-weight:600;color:var(--muted)}
.kpi b{display:block;font-family:var(--display);font-weight:600;font-size:clamp(20px,5.4vw,26px);line-height:1.15;margin-top:2px;overflow-wrap:anywhere}
.kpi small{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.kpi.main{background:var(--marca);border-color:var(--marca);color:var(--on-marca)}
.kpi.main span,.kpi.main small{color:inherit;opacity:.88}
.kpi.neg b{color:var(--danger)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--surface-2);color:var(--ink);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.warn{background:var(--warn-soft);color:var(--warn)}.pill.bad{background:var(--danger-soft);color:var(--danger)}
.sev{display:inline-block;width:10px;height:10px;border-radius:50%;flex:none;background:var(--ok)}.sev.warn{background:var(--warn)}.sev.bad{background:var(--danger)}
.bar{height:10px;border-radius:5px;background:var(--marca-soft);overflow:hidden}.bar i{display:block;height:100%;background:var(--marca);border-radius:5px}
.notice{background:var(--warn-soft);border-radius:12px;padding:11px 14px;font-size:14px;margin-bottom:14px}
.notice.ok{background:var(--ok-soft)}.notice.bad{background:var(--danger-soft)}
.empty{text-align:center;padding:36px 16px;color:var(--muted)}.empty .ic{margin:0 auto 10px;color:var(--bar)}.empty b{display:block;color:var(--ink);font-size:18px;font-family:var(--display);margin-bottom:4px}
.skel{height:14px;border-radius:7px;background:linear-gradient(90deg,var(--surface-2),var(--line),var(--surface-2));background-size:200% 100%;animation:sk 1.2s infinite linear}
@keyframes sk{to{background-position:-200% 0}}
.toast{position:fixed;left:50%;top:calc(76px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:80;background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:14px;font-weight:600;max-width:92vw;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}.toast.err{background:var(--danger);color:#fff}
.alertrow{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.alertrow .sev{margin-top:6px}.alertrow b{display:block;font-size:15px}.alertrow span{font-size:13px;color:var(--muted)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--surface);margin-bottom:14px}
table{border-collapse:collapse;width:100%;font-size:14px}
th{position:sticky;top:0;text-align:left;font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding:10px 12px;background:var(--surface-2);white-space:nowrap}
td{padding:10px 12px;border-top:1px solid var(--line);white-space:nowrap}
td.n,th.n{text-align:right}
tr.click{cursor:pointer}tr.click:hover td{background:var(--marca-soft)}
.two{display:grid;gap:14px}.three{display:grid;gap:14px}

/* ---- charts ---- */
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--body)}
.chart .v{fill:var(--ink);font-weight:700}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart rect.hit{fill:transparent}
.chart .mk{transition:opacity .12s}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin:6px 0 0}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.tip{position:fixed;z-index:90;pointer-events:none;background:var(--ink);color:var(--bg);border-radius:10px;padding:8px 10px;font-size:12px;line-height:1.35;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:220px;display:none}
.hbar{display:grid;grid-template-columns:minmax(80px,1.2fr) 3fr auto;gap:10px;align-items:center;margin:9px 0;font-size:14px}
.hbar .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.hbar .tr{height:10px;background:var(--marca-soft);border-radius:5px;overflow:hidden}.hbar .tr i{display:block;height:100%;background:var(--marca);border-radius:5px}
.hbar .vl{font-weight:700;font-variant-numeric:tabular-nums}

/* ---- POS ---- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.tile{position:relative;display:flex;flex-direction:column;gap:8px;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:10px;min-height:170px;box-shadow:var(--shadow);transition:transform .08s,border-color .15s}
.tile:hover{border-color:var(--marca)}.tile:active{transform:scale(.98)}
.tile .art{height:78px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center;overflow:hidden}
.tile .art img{width:100%;height:100%;object-fit:cover}
.tile .n{font-weight:700;font-size:15px;line-height:1.2}
.tile .p{margin-top:auto;font-family:var(--display);font-weight:600;font-size:19px;color:var(--marca-d);font-variant-numeric:tabular-nums}
.tile .badge{position:absolute;top:8px;right:8px;background:var(--marca);color:var(--on-marca);font-weight:700;font-size:13px;min-width:26px;height:26px;border-radius:13px;display:grid;place-items:center;padding:0 7px;animation:pop .18s ease-out}
@keyframes pop{from{transform:scale(.6)}to{transform:none}}
.tile.inc{border-color:var(--marca);background:var(--marca-soft)}
.tile.out{opacity:.55}
.tile .st{position:absolute;left:14px;top:14px}
.cartbar{position:fixed;left:0;right:0;bottom:calc(62px + env(safe-area-inset-bottom,0px));z-index:25;padding:0 12px 10px;pointer-events:none}
.cartbar .inner{pointer-events:auto;max-width:700px;margin:0 auto;background:var(--marca);color:var(--on-marca);border-radius:16px;display:flex;align-items:center;gap:12px;padding:10px 10px 10px 18px;box-shadow:0 10px 28px rgba(30,42,36,.28)}
.cartbar .inner>div{flex:1;min-width:0}.cartbar small{display:block;opacity:.88;font-size:13px}.cartbar b{font-family:var(--display);font-weight:600;font-size:22px}
.cartbar .btn{background:var(--surface);color:var(--marca-d)}
.qty{display:flex;align-items:center;gap:6px}.qty button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:18px}.qty b{min-width:24px;text-align:center}
.paygrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.paygrid button{min-height:52px;border:1px solid var(--line);background:var(--surface);border-radius:12px;font-weight:700;font-size:14px}
.paygrid button[aria-pressed="true"]{background:var(--marca);color:var(--on-marca);border-color:var(--marca)}
.cat{display:flex;gap:8px;overflow-x:auto;padding:2px 0 12px;scrollbar-width:none}.cat::-webkit-scrollbar{display:none}
.done{display:grid;place-items:center;text-align:center;padding:22px 8px}
.done .tick{width:84px;height:84px;border-radius:50%;background:var(--marca);color:var(--on-marca);display:grid;place-items:center;animation:pop .28s ease-out}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.keypad button{min-height:54px;border:1px solid var(--line);background:var(--surface);border-radius:12px;font-family:var(--display);font-weight:600;font-size:22px}

/* ---- sheets ---- */
.sheet{position:fixed;inset:0;z-index:70;display:flex;align-items:flex-end;justify-content:center}
.sheet.hidden{display:none}
.sheet .bg{position:absolute;inset:0;background:rgba(12,22,17,.5)}
.sheet .panel{position:relative;background:var(--surface);width:100%;max-width:580px;max-height:92vh;overflow-y:auto;border-radius:22px 22px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));animation:up .18s ease-out}
.sheet.wide .panel{max-width:760px}
.sheet .head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}.sheet .head h2{margin:0}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
@media (min-width:700px){.sheet{align-items:center}.sheet .panel{border-radius:22px}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---- login / gate ---- */
.gate{min-height:100vh;display:grid;place-items:center;padding:24px}
.gate .box{width:100%;max-width:400px;text-align:center}
.gate .logo{font-size:64px;margin-bottom:6px}
.gate p{color:var(--muted)}

/* ---- breakpoints ---- */
@media (min-width:640px){.kpis{grid-template-columns:repeat(3,1fr)}.two{grid-template-columns:1fr 1fr}.three{grid-template-columns:repeat(3,1fr)}}
@media (min-width:900px){
  .app{display:grid;grid-template-columns:232px minmax(0,1fr)}
  .rail{display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh;overflow-y:auto;padding:18px 12px;background:var(--surface);border-right:1px solid var(--line)}
  .rail .logo{font-size:38px;padding:0 10px 14px}
  .rail .grp{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:14px 12px 6px}
  .rail button.nv{position:relative;display:flex;align-items:center;gap:12px;border:0;background:none;border-radius:12px;padding:10px 12px;font-weight:600;font-size:15px;color:var(--muted);text-align:left}
  .rail button.nv:hover,.rail button.nv[aria-current="page"]{background:var(--marca-soft);color:var(--marca-d)}
  .rail [data-n]::after{top:50%!important;left:auto!important;right:10px;transform:translateY(-50%)}
  .rail .sp{flex:1;min-height:12px}.rail .rolebtn{width:100%;border-radius:12px;padding:11px}
  .rail .meta{font-size:12px;color:var(--muted);padding:8px 10px 0;display:flex;gap:6px;align-items:center}
  .top .logo,.top .rolebtn{display:none}
  .tabs,.cartbar{display:none}
  main{padding:20px 26px 48px}
  .toast{top:20px}
  .kpis{grid-template-columns:repeat(4,1fr)}
  .two.wide-l{grid-template-columns:1.5fr 1fr}
}
/* tablet horizontal (900–1099 px, p. ej. iPad 1024×768): el pedido y COBRAR siempre visibles a la derecha */
@media (min-width:900px){
  .app.has-ticket{grid-template-columns:200px minmax(0,1fr) 320px}
  .app.has-ticket .ticket{display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--surface);border-left:1px solid var(--line);padding:14px}
  .app.has-ticket .grid{grid-template-columns:repeat(auto-fill,minmax(136px,1fr))}
}
@media (min-width:1100px){
  .app.has-ticket{grid-template-columns:232px minmax(0,1fr) 390px}
  .app.has-ticket .ticket{padding:18px}
  .grid,.app.has-ticket .grid{grid-template-columns:repeat(auto-fill,minmax(164px,1fr))}
}
.tk-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}.tk-head h3{margin:0}
.tk-empty{flex:1;display:grid;place-content:center;justify-items:center;gap:10px;text-align:center;color:var(--muted);padding:40px 12px}.tk-empty .ic{color:var(--bar)}

/* ---- centro de comando ---- */

  const vieja = cajasAll().find(x => x.dev === DEV.id && x.fecha < f && x.apertura && cajaEstado(x) === "abierta"); if (vieja) throw new Error("Primero cierra la caja del " + diaCorto(vieja.fecha) + ".");
  if (cur && cur.apertura && cajaEstado(Object.assign({id}, cur)) !== "cerrada") throw new Error("La caja ya está abierta.");
  await put("cajas", id, Object.assign({fecha: f, dev: DEV.id, devNombre: DEV.nombre, movs: [], cierres: []}, cur || {}, {apertura: {id: newId(), t: Date.now(), monto: Math.max(0, monto), uid: uidActual()}}));

}
async function movimientoCaja(tipo, monto, motivo, cat) {

  if (!esAdmin() && (col("meta").permisos || {}).movimientosEmpleado === false) throw new Error("Pídele al administrador que haga este movimiento.");
  if (!(monto > 0)) throw new Error("Escribe un valor.");
  if (!motivo || !motivo.trim()) throw new Error("Escribe el motivo.");
  await put("cajas", c.id, Object.assign({}, col("cajas")[c.id], {movs: (c.movs || []).concat([{id: newId(), t: Date.now(), tipo, monto, motivo: motivo.trim(), cat: cat || "", uid: uidActual()}])}));
  audit("CAJA_" + tipo.toUpperCase(), c.id, fmt(monto) + " · " + motivo);
}
async function cerrarCaja(contado, obs, caja) {
  const c = caja || cajaHoy(); if (!c || cajaEstado(c) !== "abierta") throw new Error("No hay una caja abierta para cerrar.");
  const k = cajaCalc(c), dif = contado - k.esperado;
  if (dif !== 0 && !(obs || "").trim()) throw new Error("Hay diferencia: escribe una observación.");
  const ci = {id: newId(), t: Date.now(), uid: uidActual(), esperado: k.esperado, contado, dif, obs: (obs || "").trim(), resumen: {ventas: k.ventas, n: k.n, por: k.por, apertura: k.apertura, ingresos: k.ingresos, retiros: k.retiros, gastos: k.gastos}};
  await put("cajas", c.id, Object.assign({}, col("cajas")[c.id], {cierres: (c.cierres || []).concat([ci])}));
  audit("CIERRE_CAJA", c.id, "Esperado " + fmt(k.esperado) + " · contado " + fmt(contado) + " · dif " + fmt(dif));
  return ci;
}
async function reabrirCaja(c) {

  const ult = (c.cierres || []).slice(-1)[0];   // se guarda QUÉ cierre se reabre: no depende de los relojes de cada equipo

/* ---------- inventario ---------- */
async function registrarMerma(pid, q, motivo, obs) {
  if (!(q > 0)) throw new Error("Escribe la cantidad."); const f = S.today, id = cajaId(f), cur = col("mermas")[id] || {fecha: f, dev: DEV.id, items: []};
  await put("mermas", id, Object.assign({}, cur, {items: cur.items.concat([{id: newId(), t: Date.now(), pid, q, motivo, obs: obs || "", uid: uidActual()}])}));
  audit("MERMA", pid, q + " · " + motivo);
}
/* movimientos de inventario (kardex): cada cambio de existencias deja registro con antes y después */
async function movInv(items) {
  if (!items.length) return; const f = S.today, id = cajaId(f), cur = col("movinv")[id] || {fecha: f, dev: DEV.id, items: []};
  await put("movinv", id, Object.assign({}, cur, {items: cur.items.concat(items.map(x => Object.assign({id: newId(), t: Date.now(), uid: uidActual()}, x)))}));
}
async function fijarStock(pid, nuevo, mov) {
  const antes = stockDe(pid); await put("stock", pid, {base: nuevo, t: Date.now()});
  await movInv([Object.assign({pid, antes: antes == null ? null : antes, despues: nuevo, q: antes == null ? nuevo : nuevo - antes}, mov)]);
  return antes;
}
// entradas, compras, producción y consumo: movimiento con signo. NO reescribe la base del inventario, así nunca se
// pierden ventas de otros equipos que aún no sincronizan. Si el producto nunca se contó, la primera entrada fija la base.
async function sumarStock(pid, q, mov) {
  const antes = stockDe(pid); if (antes == null) return fijarStock(pid, Math.max(0, q), mov);
  await movInv([Object.assign({pid, delta: true, q, antes, despues: Math.round((antes + q) * 1000) / 1000}, mov)]);
  return antes;
}
// el historial de ventas en el equipo cubre ~95 días: si un inventario no se cuenta en 80 días, se hace un corte automático (sin cambiar la cantidad)
async function rebaseStockViejo() {
  if (!esAdmin() || DS.mode !== "db" || !DS.remoteSeen) return; const lim = Date.now() - 80 * 864e5;
  for (const [pid, s0] of Object.entries(stockDocs())) { const p = prod(pid), st = stockDe(pid); if (!p || p.controla === false || p.combo || st == null || !s0 || (s0.t || 0) > lim || OUT[pathOf("stock", pid)]) continue;
    await fijarStock(pid, st, {tipo: "rebase", motivo: "Corte automático del inventario"}).catch(() => {}); }
}
async function contarStock(pid, cantidad, motivo) {
  exigirAdmin(); const p = prod(pid), antes = await fijarStock(pid, cantidad, {tipo: "conteo", motivo: motivo || "Conteo"});
  audit("AJUSTE_INVENTARIO", pid, (p ? p.nombre : pid) + ": " + (antes == null ? "sin contar" : antes) + " → " + cantidad + (motivo ? " · " + motivo : ""));
}
async function entradaStock(pid, q, o = {}) {
  exigirAdmin(); if (!(q > 0)) throw new Error("Escribe cuántas llegaron."); const st = stockDe(pid), p = prod(pid);
  await sumarStock(pid, q, {tipo: "entrada", motivo: o.motivo || "Llegó mercancía", ref: o.proveedor || ""});
  if (o.costo > 0 && (costos()[pid] || {}).costo !== o.costo) await fijarCosto(pid, o.costo, "entrada de mercancía");
  audit("ENTRADA_INVENTARIO", pid, (p ? p.nombre : pid) + ": +" + q + (o.proveedor ? " · " + o.proveedor : ""));
}
async function fijarCosto(pid, costo, motivo) {
  exigirAdmin(); const cur = costos()[pid] || {hist: []}, h = (cur.hist || []).slice();
  if (cur.costo === costo) return; h.push({t: Date.now(), c: costo}); await put("costos", pid, {costo, hist: h.slice(-40)});
  audit("CAMBIO_COSTO", pid, (cur.costo == null ? "sin costo" : fmt(cur.costo)) + " → " + fmt(costo) + (motivo ? " · " + motivo : ""));
}

/* ---------- productos ---------- */
async function guardarProducto(id, d, costo) {
  exigirAdmin(); const ant = id ? prod(id) : null; id = id || "p" + newId(); const nuevo = Object.assign({}, ant ? deepClone(col("productos")[id]) : {orden: prods().length + 1}, d);
  delete nuevo.id; await put("productos", id, nuevo);
  if (!ant) audit("PRODUCTO_CREADO", id, nuevo.nombre); else if (ant.precio !== nuevo.precio) audit("CAMBIO_PRECIO", id, ant.nombre + ": " + fmt(ant.precio) + " → " + fmt(nuevo.precio));
  else if ((ant.activo !== false) !== (nuevo.activo !== false)) audit(nuevo.activo === false ? "PRODUCTO_DESACTIVADO" : "PRODUCTO_REACTIVADO", id, ant.nombre);
  else audit("PRODUCTO_EDITADO", id, nuevo.nombre);
  if (costo !== undefined && costo !== null && costo !== "") await fijarCosto(id, costo);
  return id;
}
async function guardarReceta(pid, lineas, rinde) { exigirAdmin(); await put("recetas", pid, {lineas, rinde: rinde || 1}); audit("RECETA", pid, lineas.length + " ingredientes"); }
async function producir(pid, q) {
  exigirAdmin(); if (!(q > 0)) throw new Error("Escribe la cantidad."); const r = col("recetas")[pid], p = prod(pid), st = stockDe(pid);
  await sumarStock(pid, q, {tipo: "produccion", motivo: "Producción"});
  if (r) for (const l of r.lineas) { const s = stockDe(l.iid); if (s != null) await sumarStock(l.iid, -Math.round(l.q * q / (r.rinde || 1) * 1000) / 1000, {tipo: "consumo", motivo: "Producción de " + q + " " + p.nombre}); }
  audit("PRODUCCION", pid, q + " de " + p.nombre);
}

function barras(data, o = {}) {      // data: [{l, v, tip, hi}]
  const W = 340, H = o.h || 150, top = 22, bot = 24, n = data.length, slot = W / Math.max(1, n), bw = Math.min(34, slot * 0.62), max = Math.max(1, ...data.map(x => x.v)), ph = H - top - bot;
  const marcar = new Set(); data.forEach((x, i) => { if (x.v === max && x.v > 0) marcar.add(i); if (x.hi) marcar.add(i); });
  const gs = [0.5, 1].map(f => `<path class="grid" d="M0 ${H - bot - ph * f}H${W}"/>`).join("");
  const bs = data.map((x, i) => { const h = x.v ? Math.max(3, x.v / max * ph) : 2, cx = slot * i + slot / 2, y = H - bot - h;
    return `<g data-tip="${esc(x.tip || x.l + ": " + (o.fmt || fmtK)(x.v))}"><rect class="hit" x="${slot * i}" y="0" width="${slot}" height="${H}"/><rect class="mk" x="${cx - bw / 2}" y="${y}" width="${bw}" height="${h}" rx="4" style="fill:${x.hi ? "var(--marca)" : "var(--bar)"}"/>${marcar.has(i) ? `<text class="v" x="${cx}" y="${y - 6}" text-anchor="middle">${esc((o.fmt || fmtK)(x.v))}</text>` : ""}<text x="${cx}" y="${H - 8}" text-anchor="middle">${esc(x.l)}</text></g>`; }).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.aria || "Gráfico de barras")}">${gs}${bs}</svg>`;

function lineas(series, o = {}) {    // series: [{n, c, pts:[{l,v}]}]
  const W = 340, H = o.h || 160, top = 14, bot = 22, left = 4, pts = series[0].pts, n = pts.length, max = Math.max(1, ...series.flatMap(s => s.pts.map(p => p.v))), min = Math.min(0, ...series.flatMap(s => s.pts.map(p => p.v))), ph = H - top - bot, X = i => left + (W - left * 2) * (n <= 1 ? .5 : i / (n - 1)), Y = v => top + ph * (1 - (v - min) / (max - min || 1));
  const ls = series.map(s => `<path d="${s.pts.map((p, i) => (i ? "L" : "M") + X(i).toFixed(1) + " " + Y(p.v).toFixed(1)).join("")}" fill="none" stroke-width="2" stroke-linejoin="round" style="stroke:${s.c}"/>`).join("");

  if (e.key === "Escape" && sheetFn) { cerrar(); return; }
  const tag = (document.activeElement || {}).tagName;
  if (e.key === "Enter" && !e.shiftKey) {
    if (sheetFn) { const b = $("#panel [data-act='confirmarVenta']"); if (b && !/TEXTAREA/.test(tag)) { e.preventDefault(); b.click(); } return; }
    if (S.tab === "vender" && S.cart.length && !/INPUT|TEXTAREA|SELECT/.test(tag)) { e.preventDefault(); ACT.cobrar(); }
  }
  if (e.key === "/" && esAdmin() && !/INPUT|TEXTAREA|SELECT/.test(tag)) { e.preventDefault(); ACT.buscar(); }
});
window.addEventListener("hashchange", () => { const h = (location.hash || "").replace("#", ""); if (!h) return; if (!RUTAS[h]) return; if (!rutaOk(h)) { toast("Esa sección es solo para el administrador.", true); try { history.replaceState(null, "", "#" + (esAdmin() ? "hoy" : "vender")); } catch (e) {} S.tab = "vender"; } else S.tab = h; draw(); });
window.matchMedia("(min-width:1100px)").addEventListener("change", () => draw());
document.querySelectorAll("#sheet [data-close]").forEach(b => b.addEventListener("click", cerrar));
$("#sheet .bg").addEventListener("click", cerrar);

/* ---------- una sola ventana escritora por equipo ----------
   Si OLI se abre dos veces en el mismo equipo (PWA + pestaña, o dos pestañas), las dos escribirían el mismo documento del día
   y una pisaría las ventas de la otra. Solo una ventana trabaja; la otra queda en pausa y puede tomar el control. */
function tomarCandado(robar) {
  if (!navigator.locks || typeof navigator.locks.request !== "function") return Promise.resolve(true);
  return new Promise(res => {
    navigator.locks.request("oli-escritor", robar ? {steal: true} : {ifAvailable: true}, lock => { if (!lock) { res(false); return; } res(true); return new Promise(() => {}); })
      .catch(() => { DS.bloqueada = true; cerrar(); pausaHTML(); });       // otra ventana tomó el control
  });
}
function pausaHTML() {
  $("#app").classList.add("gate-mode"); ["#ticket", "#cartbar", "#tabs", "#rail", "#banners"].forEach(x => { const el = $(x); if (el) el.innerHTML = ""; });
  $("#view").innerHTML = `<div class="gate"><div class="box"><div class="logo">OLI</div><h2>OLI está abierta en otra ventana</h2><p>Para no duplicar ni perder ventas, en este equipo OLI trabaja en una sola ventana a la vez. Usa la otra ventana o continúa aquí.</p><button class="btn pri xl wide" data-act="usarAqui">USAR OLI EN ESTA VENTANA</button></div></div>`;
}
ACT.usarAqui = () => { try { sessionStorage.setItem("oli-robar", "1"); } catch (e) {} location.reload(); };
/* ---------- boot ---------- */
(async function boot() {
  aplicarTema(); $("#view").innerHTML = splash();
  try {
    let robar = false; try { robar = sessionStorage.getItem("oli-robar") === "1"; sessionStorage.removeItem("oli-robar"); } catch (e) {}
    if (!(await tomarCandado(robar))) { DS.bloqueada = true; pausaHTML(); return; }
    await bootData(); await restoreCart();
    S.tab = leerHash() || (esAdmin() ? "hoy" : "vender"); if (!rutaOk(S.tab)) S.tab = "vender";
    changed(); setTimeout(() => heartbeat(true), 1500); setTimeout(() => rebaseStockViejo().catch(() => {}), 20000);
    setInterval(() => { const t = ymd(); if (t !== S.today) { S.today = t; changed(); } }, 30000);
  } catch (e) { console.error(e); $("#view").innerHTML = vacio("alerta", "No se pudo abrir OLI", "Recarga la página. Si sigue igual, avisa al administrador."); }
})();
/* gancho de pruebas automáticas: solo en localhost (nunca en producción) */
if (/^(localhost|127\.0\.0\.1)$/.test(location.hostname)) window.__oli = expr => eval(expr);

})();
</script>
